name: bootstrap-license

on:
  push:
    paths:
      - .github/workflows/bootstrap-license.yml

permissions:
  contents: write

jobs:
  add-license:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Install canonical GPL-3.0 text
        run: |
          cp /usr/share/common-licenses/GPL-3 LICENSE
          test "$(git hash-object LICENSE)" = "f288702d2fa16d3cdf0035b15a9fcbc552cd88e7"
      - name: Commit license
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LICENSE
          git commit -m "Add canonical GPL-3.0-only license (#2)"
          git push
